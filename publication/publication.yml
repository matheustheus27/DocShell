# ==============================================================================
# GlassHub DocShell - Central Publication Configuration
# ==============================================================================

document:
  title: "GlassHub DocShell - Intelligent Documentation Framework"
  subtitle: "Architecture, Engineering and Technical Specification Guide for the GlassHub Ecosystem"
  author: "Matheus Ferreira"
  version: "1.0.0"
  release: "v1.0"
  language: "en-US"
  
  # Output settings
  output:
    pdf:
      enabled: true
      basename: "GlassHub-DocShell-Technical-Specification"
      directory: "dist/pdf"
    website:
      enabled: true
      directory: "dist/webpage"
      # Default website runtime: 'python' (or 'py'), 'php', 'javascript' (or 'js')
      default_runtime: "python"
      # Default local server port
      port: 8000

# Document institutional metadata
metadata:
  organization: "GlassHub Platform"
  document_type: "Technical Specification & Architecture"
  classification: "Public"
  department: "Software Architecture & Engineering"
  license: "Non-commercial reservation (CC BY-NC 4.0)"
  generated_by: "GlassHub DocShell Multi-Platform Engine"

# Revision information
review:
  last_review:
    date: "2026-08-13"
  reviewers:
    - "Lead Architect"
    - "Tech Lead"

# Visual Theme Models Configuration
# Available models: 'glassmorphic', 'corporate', 'modern-dark', 'minimal'
theme:
  default_model: "glassmorphic"
  
  # Global custom colors (inherited or overridden by model)
  colors:
    primary: "#6366f1"        # Vibrant Indigo
    primary_dark: "#4338ca"   # Dark Indigo
    primary_light: "#818cf8"  # Light Indigo
    accent: "#06b6d4"         # Cyan
    accent_glow: "rgba(6, 182, 212, 0.4)"
    background_dark: "#0f172a"# Dark Slate
    background_light: "#ffffff"
    text_dark: "#0f172a"
    text_light: "#f8fafc"
    surface: "rgba(30, 41, 59, 0.7)"
    border: "rgba(255, 255, 255, 0.1)"

# AI & RAG Configuration
ai_assistant:
  enabled: true
  provider: "ollama"           # 'ollama', 'openai', 'gemini'
  ollama:
    host: "http://127.0.0.1:11434"
    chat_model: "llama3.2"     # or 'mistral', 'qwen2.5', etc.
    embed_model: "nomic-embed-text"
    translate_model: "translategemma"
  rag:
    top_k: 5
    chunk_size: 600
    chunk_overlap: 100
    index_cache_dir: ".rag_cache"
