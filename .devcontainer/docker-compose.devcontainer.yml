version: '3.8'

services:
  rag:
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace:/workspace/scripts:/app
      SITE_ROOT: /workspace/dist/webpage/frontend
      RAG_CACHE_DIR: /data/rag
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB_NAME: docshell
      MONGO_URI: mongodb://mongo:27017/docshell
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: http://ollama:11434
    command: /bin/sh -c "while sleep 1000; do :; done"
