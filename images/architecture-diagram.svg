<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg)"/>
  
  <!-- Header Title -->
  <text x="400" y="45" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">ARQUITETURA DOCSHELL - PIPELINE MULTI-ENGINE</text>
  <line x1="250" y1="60" x2="550" y2="60" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left: Source Docs (Markdown + Images) -->
  <rect x="40" y="100" width="200" height="300" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="140" y="130" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">📂 /docs &amp; /images</text>
  <rect x="55" y="150" width="170" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="175" fill="#f1f5f9" font-family="monospace" font-size="12" text-anchor="middle">01-visao-geral.md</text>
  
  <rect x="55" y="200" width="170" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="225" fill="#f1f5f9" font-family="monospace" font-size="12" text-anchor="middle">02-arquitetura/...</text>
  
  <rect x="55" y="250" width="170" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="275" fill="#f1f5f9" font-family="monospace" font-size="12" text-anchor="middle">03-guia-de-uso/...</text>

  <rect x="55" y="300" width="170" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="325" fill="#f1f5f9" font-family="monospace" font-size="12" text-anchor="middle">images/*.png, *.svg</text>

  <rect x="55" y="350" width="170" height="35" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="140" y="372" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ordenação Numérica</text>

  <!-- Arrow 1 -->
  <path d="M 245 250 L 295 250" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <polygon points="295,245 305,250 295,255" fill="#06b6d4"/>

  <!-- Center: Core Engine (Atomic Scripts) -->
  <rect x="305" y="100" width="200" height="300" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="405" y="130" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ Core Engine</text>
  
  <rect x="320" y="150" width="170" height="45" rx="6" fill="#0f172a" stroke="#0e7490" stroke-width="1"/>
  <text x="405" y="172" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smart Doc Parser</text>
  <text x="405" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">TOC + Anchors + Tree</text>

  <rect x="320" y="205" width="170" height="45" rx="6" fill="#0f172a" stroke="#0e7490" stroke-width="1"/>
  <text x="405" y="227" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Theme &amp; Models</text>
  <text x="405" y="241" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Glassmorphic, Corporate...</text>

  <rect x="320" y="260" width="170" height="45" rx="6" fill="#0f172a" stroke="#0e7490" stroke-width="1"/>
  <text x="405" y="282" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RAG &amp; AI Vectorizer</text>
  <text x="405" y="296" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ollama / Embeddings</text>

  <rect x="320" y="315" width="170" height="45" rx="6" fill="#0f172a" stroke="#0e7490" stroke-width="1"/>
  <text x="405" y="337" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Link &amp; Asset Validator</text>
  <text x="405" y="351" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Path Sanitization</text>

  <!-- Arrow 2 (to PDF) -->
  <path d="M 510 170 L 565 150" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="563,144 575,148 566,155" fill="#a855f7"/>

  <!-- Arrow 3 (to Web) -->
  <path d="M 510 320 L 565 340" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="566,334 575,342 563,346" fill="#10b981"/>

  <!-- Right Top: PDF Output -->
  <rect x="575" y="100" width="185" height="110" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="667" y="125" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📄 dist/pdf/</text>
  <text x="667" y="148" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">PDF Versionado</text>
  <text x="667" y="165" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">{name}-{release}.pdf</text>
  <text x="667" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pandoc + XeLaTeX / HTML2PDF</text>

  <!-- Right Bottom: Web Output (Py / PHP / JS) -->
  <rect x="575" y="240" width="185" height="160" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="667" y="265" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🌐 dist/webpage/</text>
  
  <rect x="585" y="280" width="50" height="28" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="610" y="298" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🐍 Py</text>

  <rect x="642" y="280" width="50" height="28" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="667" y="298" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🐘 PHP</text>

  <rect x="699" y="280" width="50" height="28" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
  <text x="724" y="298" fill="#fde047" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚡ JS</text>

  <text x="667" y="335" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Live Search + RAG AI Chat</text>
  <text x="667" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Temas Dinâmicos &amp; Mobile-Ready</text>
  <text x="667" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Docker &amp; Nginx Ready</text>
</svg>
